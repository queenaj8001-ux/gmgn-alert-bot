name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-test-build:
    name: Lint → Test → Build
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 📦 Install Python dependencies
      run: |
        pip install pylint pytest pytest-cov
    
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: 📦 Install Node dependencies
      run: |
        npm ci
    
    - name: 📋 PHASE 1 - LINT (Python tests)
      run: |
        echo "======================================================================"
        echo "📋 PHASE 1: LINT"
        echo "======================================================================"
        pylint tests/*.py --disable=C0114,C0115,C0116,R0903,E0401 || exit 1
    
    - name: 📊 PHASE 2 - TEST (Python)
      run: |
        echo "======================================================================"
        echo "📊 PHASE 2: TEST"
        echo "======================================================================"
        pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml
    
    - name: 🔨 PHASE 3 - BUILD (JavaScript syntax check)
      run: |
        echo "======================================================================"
        echo "🔨 PHASE 3: BUILD"
        echo "======================================================================"
        node -c index.js
        echo "✅ JavaScript syntax valid"
    
    - name: ✅ All phases passed
      run: |
        echo "======================================================================"
        echo "✅ CI/CD PIPELINE PASSED"
        echo "======================================================================"
        echo "✅ LINT: Python tests validated"
        echo "✅ TEST: All tests passed"
        echo "✅ BUILD: JavaScript syntax valid"
        echo ""
        echo "Ready for deployment! 🚀"
